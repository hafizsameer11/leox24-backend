[program:leox24-queue-worker]
process_name=%(program_name)s
command=/usr/bin/php /var/www/leox24-backend/artisan queue:work database --queue=lead-import,default --sleep=3 --tries=1 --timeout=1800 --max-time=3600
directory=/var/www/leox24-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/leox24-queue-worker.log
stopwaitsecs=1860
